<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimarket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="main-container">
        <header>
            <h1>Bienvenido al Minimarket</h1>
            <button id="logout-button">Cerrar Sesión</button>
        </header>

        <div class="toolbar">
            <input type="text" id="search-bar" placeholder="Buscar productos por nombre...">
        </div>

        <main id="main-content">
            <h2>Cargando...</h2>
        </main>

        <div id="cart">
            <h3>Carrito</h3>
            <div id="cart-items"></div>
            <div class="cart-summary">
                <p>Total: S/ <span id="cart-total">0.00</span></p>
                <input type="text" id="customer-doc" placeholder="Ingresa tu DNI/RUC">
                <button id="create-order-button">Crear Orden</button>
            </div>
        </div>

        <!-- Nueva sección para Mis Órdenes -->
        <div id="orders-history">
            <h3>Mis Órdenes</h3>
            <table id="orders-table">
                <thead>
                    <tr>
                        <th>ID Orden</th>
                        <th>Fecha</th>
                        <th>Nro. Documento</th>
                        <th>Total</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <!-- Las órdenes se insertarán aquí dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Estructura del Modal (oculto por defecto) -->
    <div id="confirmation-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Orden Creada con Éxito</h2>
            <div id="modal-order-details">
                <!-- Detalles de la orden se insertarán aquí -->
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
